[project]
name = "barreau-valerian-concevez-et-deployer-systeme-rag-10-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.142.4",
    "langchain-community==0.4.1",
    "langchain-core>=1.6.6",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

# Outils de développement (notebook, évaluation) : installés en local par `uv sync`,
# mais pas dans l'image Docker (`uv sync --no-dev`)
[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "langchain-mistralai>=1.1.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ragas>=0.4.3",
]

# Sous Linux (image Docker), PyTorch en version CPU : évite plusieurs Go de bibliothèques CUDA
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # permet `import normalize`, `import rag`, `import api` depuis les tests
